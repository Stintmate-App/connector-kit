[project]
name = "skeleton-connector"
version = "1.0.0"
description = "A minimal Stintmate connector for authors of new connectors (fake simulator, synthetic laps)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "stintmate-ipc",
]

[tool.uv.sources]
# The Python binding of the Rust implementation: the wheel that fetch-ipc.ps1 puts in vendor/.
stintmate-ipc = { path = "vendor/stintmate_ipc-0.3.3-py3-none-win_amd64.whl" }

[project.gui-scripts]
skeleton-connector = "skeleton_connector.main:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
